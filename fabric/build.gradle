plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Bundled for Fabric TOML config (NeoForge already ships NightConfig).
    include(implementation("com.electronwill.night-config:core:3.6.7"))
    include(implementation("com.electronwill.night-config:toml:3.6.7"))
    // Used by EventBus generics; NeoForge resolves via common runtime, Fabric must jar-in-jar.
    include(implementation("net.jodah:typetools:0.6.3"))
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

remapJar {
    archiveFileName.set("${mod_id}-fabric-${minecraft_version}-${version}.jar")
}
