name: Auto Label Issues

on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Apply labels from issue form responses
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body ?? "";
            const labels = [];

            // Helper: extract the value under a given section heading
            function getField(heading) {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(
                `###\\s*${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n###|$)`,
                "i"
              );
              const match = body.match(regex);
              return match ? match[1].trim() : "";
            }

            // ── Mod loader (bug reports) ─────────────────────────────────────
            // Field is a free-text input so we check for keywords
            const loader = getField("Mod loader & version").toLowerCase();
            if (loader.includes("neoforge")) {
              labels.push("🦊 NeoForge");
            } else if (loader.includes("fabric")) {
              labels.push("📜 Fabric");
            } else if (loader.includes("forge")) {
              labels.push("🔨 Forge");
            }

            // ── Minecraft version (bug reports) ──────────────────────────────
            const mcVersion = getField("Minecraft version");
            if (mcVersion.includes("1.21")) {
              labels.push("🥇 1.21.1");
            } else if (mcVersion.includes("1.20")) {
              labels.push("🥈 1.20.1");
            }

            // ── Category dropdown (both templates) ───────────────────────────
            // Maps dropdown option text → label. Add more here as needed.
            const category = getField("What part of the mod is affected?") ||
                             getField("Category");
            const categoryMap = {
              "Blockling behavior": null,   // no matching label yet
              "Combat":            null,
              "Blocks":            null,
              "Items":             null,
              "Config":            null,
              "UI":                null,
              "World generation":  null,
              "Crash":             null,
              "Mod compatibility": null,
            };
            // (Extend this map once you add category-specific labels)

            // ── Apply all collected labels ────────────────────────────────────
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels,
              });
              console.log(`Applied labels: ${labels.join(", ")}`);
            } else {
              console.log("No automatic labels matched for this issue.");
            }
